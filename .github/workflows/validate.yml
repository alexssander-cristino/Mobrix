name: Validate Mobrix
on:
  push:
    branches: [main, feat/industrial-marceria-pro]
  pull_request:
    branches: [main]
jobs:
  syntax-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mobrix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mobrix
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/ci-db-setup.js
      - run: npm run db:migrate
      - run: npm test
