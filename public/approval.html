<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação de projeto | MOBRIX</title><link rel="stylesheet" href="/styles.css"></head><body><main class="public-trace"><p class="eyebrow">MOBRIX APPROVAL</p><h1>Aprovação do projeto</h1><section id="approval-card" class="panel">Carregando proposta...</section></main><script>const token=location.pathname.split('/').pop(),card=document.getElementById('approval-card');fetch('/api/innovation/approval/'+encodeURIComponent(token)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok)throw new Error(d.error||'Link indisponível');card.innerHTML='<h2>'+d.title+'</h2><p>'+d.company_name+'</p><p>'+String(d.description||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><h2>'+Number(d.sale_price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+'</h2><p>Prazo previsto: '+(d.deadline?new Date(d.deadline.slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'A combinar')+'</p><form id="approval-response"><textarea name="notes" placeholder="Observações ou ajustes solicitados"></textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-primary" name="decision" value="aprovado">Aprovar proposta</button><button class="btn btn-secondary" name="decision" value="ajustes">Solicitar ajustes</button></div></form>';document.getElementById('approval-response').onsubmit=async e=>{e.preventDefault();const decision=e.submitter.value,notes=new FormData(e.currentTarget).get('notes');const r=await fetch('/api/innovation/approval/'+encodeURIComponent(token)+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,notes})});const x=await r.json();if(!r.ok)throw new Error(x.error);card.textContent=decision==='aprovado'?'Proposta aprovada. Obrigado!':'Solicitação de ajustes enviada. Obrigado!'}}).catch(e=>card.textContent=e.message)</script></body></html>
