<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastreio de peça | MADEVIX</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/legal.css"></head><body><main class="public-trace"><p class="eyebrow">MADEVIX TRACE</p><h1>Rastreabilidade da peça</h1><div id="trace-status" class="panel">Consultando etiqueta...</div></main><script>const code=decodeURIComponent(location.pathname.split('/').pop());fetch('/api/innovation/trace/public/'+encodeURIComponent(code)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{const el=document.getElementById('trace-status');if(!ok)throw new Error(d.error||'Etiqueta indisponível');const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));el.innerHTML='<h2>'+safe(d.part_name)+'</h2><p>'+safe(d.project_title)+'</p><p>'+safe(d.dimensions)+'</p><strong>Etapa atual: '+safe(d.status)+'</strong><small style="display:block;margin-top:12px">Atualizado em '+new Date(d.updated_at).toLocaleString('pt-BR')+'</small><div class="field" style="margin-top:16px"><label>Atualizar etapa<select id="trace-next">'+['aguardando','corte','usinagem','montagem','acabamento','instalacao','concluida','problema'].map(s=>'<option value="'+s+'" '+(s===d.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label><button class="btn btn-primary" id="trace-save" type="button">Salvar etapa</button><small>Para atualizar, abra este QR Code em um dispositivo com sessão Madevix ativa.</small></div>';document.getElementById('trace-save').onclick=async()=>{const token=localStorage.getItem('mobrix_token');if(!token){alert('Entre no Madevix neste dispositivo para atualizar a etiqueta.');return}const response=await fetch('/api/innovation/trace/'+encodeURIComponent(d.id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status:document.getElementById('trace-next').value})});if(!response.ok){const err=await response.json().catch(()=>({}));alert(err.error||'Não foi possível atualizar.');return}location.reload()}}).catch(e=>document.getElementById('trace-status').textContent=e.message)</script><footer class="legal-public-footer"><a href="/privacidade.html">Privacidade</a><a href="/termos.html">Termos de Uso</a><a href="/cookies.html">Cookies</a></footer></body></html>
