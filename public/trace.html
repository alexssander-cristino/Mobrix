<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastreio de peça | MOBRIX</title><link rel="stylesheet" href="/styles.css"></head><body><main class="public-trace"><p class="eyebrow">MOBRIX TRACE</p><h1>Rastreabilidade da peça</h1><div id="trace-status" class="panel">Consultando etiqueta...</div></main><script>const code=decodeURIComponent(location.pathname.split('/').pop());fetch('/api/innovation/trace/public/'+encodeURIComponent(code)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{const el=document.getElementById('trace-status');if(!ok)throw new Error(d.error||'Etiqueta indisponível');el.innerHTML='<h2>'+d.part_name+'</h2><p>'+d.project_title+'</p><p>'+d.dimensions+'</p><strong>Etapa atual: '+d.status+'</strong><small style="display:block;margin-top:12px">Atualizado em '+new Date(d.updated_at).toLocaleString('pt-BR')+'</small>'}).catch(e=>document.getElementById('trace-status').textContent=e.message)</script></body></html>
