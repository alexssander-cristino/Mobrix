</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><link rel="stylesheet" href="/legal.css"></head><body><main class="showroom"><header class="showroom-head"><p class="eyebrow">MOBRIX · APRESENTAÇÃO DE PRODUTO</p><h1 id="title">Showroom virtual</h1><p id="company">Carregando apresentação...</p></header><section class="showroom-card" id="content"></section></main><script>
(async()=>{const box=document.getElementById('content'),token=location.pathname.split('/').filter(Boolean).pop(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('/api/intelligent/showroom/public/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Apresentação indisponível.');document.getElementById('title').textContent=d.title;document.getElementById('company').textContent=[d.company_name,d.project_title].filter(Boolean).join(' · ');const scale=Math.max(.1,Math.min(5,Number(d.config?.scale)||1));box.innerHTML='<div class="showroom-meta"><strong>'+esc(d.title)+'</strong><small>Visualização 3D · AR depende do dispositivo</small></div><model-viewer src="'+esc(d.model_url)+'" scale="'+scale+' '+scale+' '+scale+'" camera-controls touch-action="pan-y" shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look" alt="'+esc(d.title)+'"><button slot="ar-button" class="btn btn-primary">Ver no meu ambiente</button></model-viewer>'}catch(e){box.textContent=e.message}})();
