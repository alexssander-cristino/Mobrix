<html lang="pt-BR"><head>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191a1e"><title>Passaporte digital | Mobrix</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#eceef1}.passport{max-width:760px;margin:8vh auto;padding:24px}.passport-head{background:#202126;color:#fff;border-radius:14px;padding:28px}.passport-head .eyebrow{color:#ef7777}.passport-head h1{font:800 25px Manrope;margin:0 0 8px}.passport-head p{color:#c5c6cc;font-size:12px}.passport-card{margin-top:15px;background:#fbfbfc;border:1px solid #dfe1e5;border-radius:12px;padding:22px}.passport-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.passport-grid div{background:#f0f1f3;padding:14px;border-radius:8px}.passport-grid small{display:block;color:#777b84;font-size:10px;margin-bottom:5px}.passport-grid strong{font-size:13px}.passport-timeline{margin-top:22px;border-top:1px solid #e0e1e4;padding-top:16px}.passport-timeline h2{font:700 15px Manrope;margin:0 0 12px}.passport-timeline article{padding:11px 0;border-bottom:1px solid #eceef1}.passport-timeline strong{font-size:12px}.passport-timeline small{display:block;color:#777;font-size:10px;margin-top:4px}.passport-timeline p{font-size:10px;color:#777;overflow-wrap:anywhere}.passport-note{font-size:11px;color:#777b84;line-height:1.6;margin-top:18px}@media(max-width:600px){.passport{padding:14px}.passport-grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="/legal.css"></head><body><main class="passport"><header class="passport-head"><p class="eyebrow">MOBRIX · DOCUMENTAÇÃO DO PRODUTO</p><h1>Passaporte digital do móvel</h1><p>Informações de identificação e garantia fornecidas pela empresa responsável.</p></header><section id="passport-data" class="passport-card"><p class="loading">Consultando passaporte...</p></section></main><script>
(async()=>{const box=document.getElementById('passport-data'),token=location.pathname.split('/').filter(Boolean).pop();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('/api/studio/passport/public/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Passaporte indisponível.');box.innerHTML='<div class="passport-grid"><div><small>Empresa</small><strong>'+esc(d.company_name)+'</strong></div><div><small>Projeto / produto</small><strong>'+esc(d.title)+'</strong></div><div><small>Situação</small><strong>'+esc(d.status)+'</strong></div><div><small>Garantia até</small><strong>'+(d.warranty_until?new Date(d.warranty_until+'T12:00:00').toLocaleDateString('pt-BR'):'Não informada')+'</strong></div><div><small>Projeto cadastrado em</small><strong>'+new Date(d.created_at).toLocaleDateString('pt-BR')+'</strong></div></div><p class="passport-note">Este passaporte apresenta somente informações básicas. Para assistência, garantia ou manutenção, entre em contato diretamente com a empresa responsável.</p>';const historyResponse=await fetch('/api/intelligent/history/public/'+encodeURIComponent(token),{cache:'no-store'});if(historyResponse.ok){const events=await historyResponse.json();box.innerHTML+='<section class="passport-timeline"><h2>Histórico do produto</h2>'+(events.map(x=>'<article><strong>'+esc(x.title)+'</strong><small>'+new Date(x.created_at).toLocaleDateString('pt-BR')+'</small><p>'+esc(JSON.stringify(x.details||{}))+'</p></article>').join('')||'<p>Nenhum evento público registrado.</p>')+'</section>'}}catch(e){box.innerHTML='<p class="empty-state">'+esc(e.message)+'</p>'}})();
</script><footer class="legal-public-footer"><a href="/privacidade.html">Privacidade</a><a href="/termos.html">Termos de Uso</a><a href="/cookies.html">Cookies</a></footer></body></html>
