<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191a1e"><title>Passaporte digital | Mobrix</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#eceef1}.passport{max-width:760px;margin:8vh auto;padding:24px}.passport-head{background:#202126;color:#fff;border-radius:14px;padding:28px}.passport-head .eyebrow{color:#ef7777}.passport-head h1{font:800 25px Manrope;margin:0 0 8px}.passport-head p{color:#c5c6cc;font-size:12px}.passport-card{margin-top:15px;background:#fbfbfc;border:1px solid #dfe1e5;border-radius:12px;padding:22px}.passport-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.passport-grid div{background:#f0f1f3;padding:14px;border-radius:8px}.passport-grid small{display:block;color:#777b84;font-size:10px;margin-bottom:5px}.passport-grid strong{font-size:13px}.passport-note{font-size:11px;color:#777b84;line-height:1.6;margin-top:18px}@media(max-width:600px){.passport{padding:14px}.passport-grid{grid-template-columns:1fr}}
</style></head><body><main class="passport"><header class="passport-head"><p class="eyebrow">MOBRIX · DOCUMENTAÇÃO DO PRODUTO</p><h1>Passaporte digital do móvel</h1><p>Informações de identificação e garantia fornecidas pela empresa responsável.</p></header><section id="passport-data" class="passport-card"><p class="loading">Consultando passaporte...</p></section></main><script>
(async()=>{const box=document.getElementById('passport-data'),token=location.pathname.split('/').filter(Boolean).pop();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('/api/studio/passport/public/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Passaporte indisponível.');box.innerHTML='<div class="passport-grid"><div><small>Empresa</small><strong>'+esc(d.company_name)+'</strong></div><div><small>Projeto / produto</small><strong>'+esc(d.title)+'</strong></div><div><small>Situação</small><strong>'+esc(d.status)+'</strong></div><div><small>Garantia até</small><strong>'+(d.warranty_until?new Date(d.warranty_until+'T12:00:00').toLocaleDateString('pt-BR'):'Não informada')+'</strong></div><div><small>Projeto cadastrado em</small><strong>'+new Date(d.created_at).toLocaleDateString('pt-BR')+'</strong></div></div><p class="passport-note">Este passaporte apresenta somente informações básicas. Para assistência, garantia ou manutenção, entre em contato diretamente com a empresa responsável.</p>'}catch(e){box.innerHTML='<p class="empty-state">'+esc(e.message)+'</p>'}})();
</script></body></html>
